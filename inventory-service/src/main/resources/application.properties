# ==============================================================================
# CẤU HÌNH INVENTORY SERVICE (Ports 8081, 8082, 8083)
# ==============================================================================
# Chỉ cần 1 file code và 1 file cấu hình này, nhưng lúc chạy chúng ta sẽ bật
# thành 3 tiến trình (3 instance) trên 3 port khác nhau bằng tham số dòng lệnh:
#   java -jar inventory-service-1.0.0.jar --server.port=8081
#   java -jar inventory-service-1.0.0.jar --server.port=8082
#   java -jar inventory-service-1.0.0.jar --server.port=8083
# Tham số --server.port=... sẽ ghi đè giá trị mặc định 8081 bên dưới.

server.port=8081

spring.application.name=inventory-service

logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{20} - %msg%n
